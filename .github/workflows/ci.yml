name: Continuous Integration

on:
  pull_request:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
            cross: true
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            rust: stable
            cross: false
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            rust: stable
            cross: true
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            rust: stable
            cross: true
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            rust: stable
            cross: false
            target: aarch64-apple-darwin
          - os: macos-latest
            rust: stable
            cross: false
            target: x86_64-apple-darwin
          - os: windows-latest
            rust: stable
            cross: true
            target: x86_64-pc-windows-gnu
          - os: windows-latest
            rust: stable
            cross: true
            target: aarch64-pc-windows-msvc
          - os: windows-latest
            rust: stable
            cross: false
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      - name: cargo build
        uses: actions-rs/cargo@v1
        with:
          command: build
          use-cross: ${{ matrix.cross }}
          args: --target ${{ matrix.target }} --verbose

      - name: cargo test
        uses: actions-rs/cargo@v1
        with:
          command: test
          use-cross: ${{ matrix.cross }}
          args: --target ${{ matrix.target }} --verbose

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - name: rustfmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
